<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore facts about countries around the world.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Country Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container search-navbar">
                <a class="navbar-brand" href="index.html">Country Explorer</a>
                <form id="country-search-form" class="d-none" role="search">
                    <input id="country-search-input" class="form-control me-2" type="search"
                        placeholder="Search a country" aria-label="Search a country" required>
                    <button class="btn btn-outline-success" type="submit" aria-label="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            viewBox="0 0 16 16" aria-hidden="true">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                    </button>
                </form>
            </div>
        </nav>
    </header>

    <main class="container country-main">
        <p id="country-status" class="country-status" role="status" aria-live="polite">
        </p>
        <div id="country-details"></div>
    </main>

    <script src="description.js" defer></script>
</body>

</html>
